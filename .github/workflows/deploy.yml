name: Deploy to GitHub Pages

# DISABLED — GymTech API runs on Cloudflare Workers, not GitHub Pages.
# GitHub Pages cannot serve the Hono API routes (/api/*). The SPA's
# client-side routing (/dashboard/*, /members/*) also requires a server
# that handles history-api fallbacks — not available on static hosting.
#
# To re-enable: change to `push: branches: [main]` and set
# VITE_API_BASE_URL as a Pages environment variable (it should point
# to your Cloudflare Workers endpoint, e.g. https://api.gymtech.app).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared & Web Packages
        run: |
          pnpm --filter @gymtech/shared build
          pnpm --filter @gymtech/web build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
