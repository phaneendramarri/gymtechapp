    <title>GymTech — Gym Management Software</title>
    <script>
      // Apply the saved app theme before first paint so the boot splash
      // and the app never flash the wrong theme. Mirrors lib/theme.tsx.
      try {
        var __t = localStorage.getItem('gymtech_theme') || 'light';
        if (__t === 'dark' || (__t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      /* Boot splash — mirrors the RouteSplash loader (logo, sliding bar,
         one-line message) so full page loads show the same branded
         loader as in-app route transitions. Removed by main.tsx on mount. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #FAFAF9; color: #0A0A0A;
        font-family: Inter, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot.boot-hide { opacity: 0; pointer-events: none; }
      #boot .boot-logo { display: inline-flex; align-items: center; gap: 10px; }
      #boot .boot-logo svg { height: 28px; width: auto; display: block; }
      #boot .boot-ink { fill: #161616; }
      #boot .boot-iron { fill: #FB923C; }
      #boot .boot-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
      #boot .boot-msg { font-size: 12px; font-weight: 500; color: #71717A; }
      #boot .boot-bar { width: 144px; height: 4px; border-radius: 999px; background: #E5E7EB; overflow: hidden; }
      #boot .boot-bar > span {
        display: block; height: 100%; width: 40%; border-radius: 999px; background: #FB923C;
        animation: boot-slide 1.1s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(380%); }
      }
      /* App-selected theme (set pre-paint by the script above) — same
         tokens as index.css .dark so boot matches the app exactly. */
      html.dark #boot { background: #0B0B0A; color: #FAFAF9; }
      html.dark #boot .boot-ink { fill: #FAFAF9; }
      html.dark #boot .boot-bar { background: #2E2E2E; }
      html.dark #boot .boot-bar > span { background: #FB923C; }
      html.dark #boot .boot-msg { color: #8A8A8E; }
    </style>
