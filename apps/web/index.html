    <title>GymTech — Gym Management Software</title>
    <style>
      /* Boot splash — paints instantly before the JS bundle loads so the
         user never stares at a blank page. Removed by main.tsx on mount. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #FAFAF9; color: #0A0A0A;
        font-family: Inter, -apple-system, "Segoe UI", sans-serif;
      }
      #boot .boot-mark {
        width: 44px; height: 44px; border-radius: 12px;
        background: #D9480F; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 20px; letter-spacing: -0.02em;
      }
      #boot .boot-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
      #boot .boot-msg { font-size: 12px; color: #71717A; }
      #boot .boot-bar { width: 148px; height: 3px; border-radius: 999px; background: #E5E7EB; overflow: hidden; }
      #boot .boot-bar > span {
        display: block; height: 100%; width: 40%; border-radius: 999px; background: #D9480F;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(380%); }
      }
      @media (prefers-color-scheme: dark) {
        #boot { background: #0B0B0A; color: #FAFAF9; }
        #boot .boot-bar { background: #2E2E2E; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <div id="boot" aria-label="Loading GymTech">
      <div class="boot-mark">G</div>
      <div class="boot-name">GymTech</div>
      <div class="boot-bar"><span></span></div>
      <div class="boot-msg">Loading your gym…</div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
